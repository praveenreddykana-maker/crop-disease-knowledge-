services:
  - type: web
    name: crop-disease-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # You will paste this in Render dashboard
      - key: VECTOR_STORE_PATH
        value: /tmp/vector_store
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: ADMIN_PASSWORD
        sync: false          # Set in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://crop-disease-assistant.vercel.app,http://localhost:5173
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: TOP_K_RESULTS
        value: "5"
      - key: PYTHONUNBUFFERED
        value: "1"
